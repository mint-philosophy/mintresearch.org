name = "mint-contact"
main = "src/index.js"
compatibility_date = "2026-09-12"
workers_dev = true
preview_urls = false

# Set account_id and the verified custom domain before production deployment.
# CONTACT_TO and CONTACT_FROM are required Worker secrets, sourced from the account.
[[send_email]]
name = "EMAIL"

[[ratelimits]]
name = "CONTACT_RATE_LIMIT"
namespace_id = "2026091201"
simple = { limit = 5, period = 60 }
