<head>
<meta charset="UTF-8">

<title>Navigating the AGI Reckoning — SAIS Seminar, 30 September 2026</title>
<!-- The deck's own faces (Big Caslon, Avenir Next Condensed, Menlo) ship with macOS and iOS.
     Elsewhere these open equivalents stand in; Pretext measures whichever face is actually used. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=JetBrains+Mono:wght@400;700&family=Libre+Caslon+Text:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; -webkit-font-smoothing: antialiased;
         text-rendering: geometricPrecision; user-select: none; -webkit-user-select: none; cursor: default; }
  #stage { position: relative; overflow: hidden; background: #A8432A; touch-action: pan-y; }
  .slide { position: absolute; inset: 0; overflow: hidden; }
  .slide > * { position: absolute; box-sizing: border-box; }
  .img { overflow: hidden; }
  .img img { position: absolute; display: block; max-width: none; pointer-events: none; }
  .tl { position: absolute; white-space: pre; overflow: visible; }
  .lines { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  #loading { color: #FFFAED; font: 14px Menlo, "JetBrains Mono", monospace; letter-spacing: 0.1em; }
  #more { position: fixed; left: 0; right: 0; bottom: 0; height: 36px; pointer-events: none; opacity: 0; transition: opacity .2s;
          background: linear-gradient(to bottom, rgba(22,19,0,0), rgba(22,19,0,.45)); }
  #more::after { content: ''; position: absolute; left: 50%; bottom: 10px; width: 9px; height: 9px; margin-left: -5px;
          border-right: 2px solid #FFFAED; border-bottom: 2px solid #FFFAED; transform: rotate(45deg); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="stage" role="region" aria-roledescription="slideshow" aria-label="Navigating the AGI Reckoning">
  <div id="loading" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">Loading…</div>
</div>
<div id="more" aria-hidden="true"></div>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p style="color:#FFFAED;font-family:Georgia,serif;padding:2em">This presentation needs JavaScript.</p></noscript>
<script type="module" src="deck.js?v=77aa7ff0df"></script>
</body>
</html>
