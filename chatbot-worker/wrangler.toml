name = "minty-chatbot"
main = "src/index.js"
compatibility_date = "2024-09-25"

# Lab-account custom domain (zone mintresearch.org lives in the same account).
# The old minty-chatbot.mintresearch.workers.dev lives in Seth's personal
# account and is retired.
routes = [
  { pattern = "minty-chatbot.mintresearch.org", custom_domain = true }
]

[vars]
VECTOR_STORE_ID = "vs_6a46841569688191a2b98efd9e98e748"
MODEL = "gpt-5.4"
REASONING_EFFORT = "medium"
ALLOWED_ORIGIN = "https://mintresearch.org"
MAX_MESSAGES_PER_IP_HOUR = "10"
MAX_MESSAGES_PER_IP_DAY = "30"
MAX_GLOBAL_DAILY = "500"
MAX_INPUT_LENGTH = "1000"
MAX_OUTPUT_TOKENS = "4096"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "0c9e131c47344fbb8e20d00bf88a551e"
