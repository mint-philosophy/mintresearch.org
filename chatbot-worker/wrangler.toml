name = "minty-chatbot"
main = "src/index.js"
compatibility_date = "2024-09-25"

# Lab-account custom domain (zone mintresearch.org lives in the same account).
# The old minty-chatbot.mintresearch.workers.dev lives in Seth's personal
# account and is retired.
routes = [
  { pattern = "minty-chatbot.mintresearch.org", custom_domain = true }
]

[vars]
VECTOR_STORE_ID = "vs_6a46841569688191a2b98efd9e98e748"
MODEL = "gpt-5.4"
REASONING_EFFORT = "medium"
ALLOWED_ORIGIN = "https://mintresearch.org"
MAX_MESSAGES_PER_IP_HOUR = "10"
MAX_MESSAGES_PER_IP_DAY = "30"
MAX_GLOBAL_DAILY = "500"
MAX_INPUT_LENGTH = "1000"
MAX_OUTPUT_TOKENS = "4096"

# Per-client burst limit (approximate, per Cloudflare location). Clients are
# keyed by IPv4 address or IPv6 /64. The exact hourly/daily quotas are in the
# ChatLimiter Durable Object below.
[[ratelimits]]
name = "CHAT_BURST"
namespace_id = "7301"

  [ratelimits.simple]
  limit = 4
  period = 60

# Exact per-client hourly/daily quotas and the global daily cap
# (MAX_* vars above), checked and incremented atomically.
[[durable_objects.bindings]]
name = "CHAT_LIMITER"
class_name = "ChatLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatLimiter"]
